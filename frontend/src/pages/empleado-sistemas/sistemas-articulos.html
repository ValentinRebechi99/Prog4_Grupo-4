<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Empleado Área Sistemas - Artículos</title>
	<link rel="stylesheet" href="../css/style.css">
	<script src="../../utils/auth.js" data-roles="2"></script>
</head>

<body>
	<div class="employee-container">
		<!-- Header -->
		<header class="employee-header">
			<div class="header-left">
				<h1 class="header-title">Empleado Área Sistemas</h1>
				<a href="../../../index.html" class="logout-btn">Salir</a>
			</div>
			<div class="header-right">
				<img src="../../imagenes/logo.jpg" alt="Logo">
			</div>
		</header>

		<!-- Main Content with Sidebar -->
		<div class="main-content">
			<!-- Sidebar Menu -->
			<aside class="sidebar-menu">
				<a href="sistemas-incidencias.html" class="menu-item">Incidencias</a>
				<a href="sistemas-articulos.html" class="menu-item active">Artículos</a>
				<a href="sistemas-categorias.html" class="menu-item">Categorías</a>
			</aside>

			<!-- Content Area -->
			<div class="content-area">
				<!-- Artículos Section -->
				<section id="articles" class="content-section articles-section active">
					<div class="section-header">
						<h2>Artículos</h2>
						<button class="btn-new" id="btn-new-article">+ Nuevo Artículo</button>
					</div>
					<div class="table-wrapper">
						<table>
							<thead>
								<tr>
									<th>Código</th>
									<th>Tipo</th>
									<th>Descripción</th>
									<th>Área</th>
									<th>Acciones</th>
								</tr>
							</thead>
							<tbody id="articles-table-body">
								<!-- Filas dinámicas -->
							</tbody>
						</table>
					</div>
				</section>
			</div>
		</div>
	</div>

	<!-- Modal para Nuevo Artículo -->
	<div id="modal-new-article" class="modal">
		<div class="modal-content">
			<span class="close-modal" data-modal="modal-new-article">&times;</span>
			<h2>Nuevo Artículo</h2>
			<form id="form-new-article" class="form-modal">
				<div class="form-group">
					<label for="new-article-category">Categoría:</label>
					<select id="new-article-category" required></select>
				</div>

				<div class="form-group">
					<label for="new-article-description">Descripción:</label>
					<textarea id="new-article-description" required></textarea>
				</div>

				<div class="form-group">
					<label for="new-article-area">Área:</label>
					<select id="new-article-area" required></select>
				</div>

				<div class="form-buttons">
					<button type="submit" class="btn-submit">GUARDAR</button>
					<button type="button" class="btn-cancel" data-modal="modal-new-article">CANCELAR</button>
				</div>
			</form>
		</div>
	</div>

	<!-- Modal para Editar Artículo -->
	<div id="modal-edit-article" class="modal">
		<div class="modal-content">
			<span class="close-modal" data-modal="modal-edit-article">&times;</span>
			<h2>Editar Artículo</h2>
			<form id="form-edit-article" class="form-modal">
				<input type="hidden" id="edit-article-id">

				<div class="form-group">
					<label for="edit-article-category">Categoría:</label>
					<select id="edit-article-category" required></select>
				</div>

				<div class="form-group">
					<label for="edit-article-description">Descripción:</label>
					<textarea id="edit-article-description" required></textarea>
				</div>

				<div class="form-group">
					<label for="edit-article-area">Área:</label>
					<select id="edit-article-area" required></select>
				</div>

				<div class="form-buttons">
					<button type="submit" class="btn-submit">Guardar Cambios</button>
					<button type="button" class="btn-cancel" data-modal="modal-edit-article">Cancelar</button>
				</div>
			</form>
		</div>
	</div>

	<script src="./sistemas-articulos.js"></script>
</body>

</html>
