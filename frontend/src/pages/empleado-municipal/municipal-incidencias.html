<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Empleado Municipal - Incidencias</title>
	<link rel="stylesheet" href="../css/style.css">
</head>

<body>
	<div class="employee-container">
		<!-- HEADER -->
		<header class="employee-header">
			<div class="header-left">
				<h1 class="header-title">Empleado Municipal</h1>
				<a href="../../../index.html" class="logout-btn">Salir</a>
			</div>
			<div class="header-right">
				<img src="../../imagenes/logo.jpg" alt="Logo Municipal">
			</div>
		</header>

		<!-- CONTENIDO PRINCIPAL -->
		<div class="main-content">
			<!-- MENÚ LATERAL -->
			<aside class="sidebar-menu">
				<a href="municipal-articulos.html" class="menu-item">Listar artículos</a>
				<a href="#create-incident" class="menu-item" id="menu-create-incident">Crear una Incidencia</a>
				<a href="#incidents" class="menu-item active" id="menu-incidents">Listado de incidencias</a>
			</aside>

			<!-- ÁREA DE CONTENIDO -->
			<div class="content-area">
				<!-- SECCIÓN: CREAR INCIDENCIA -->
				<section class="content-section create-incident-section" id="create-incident">
					<h2>Crear una Incidencia</h2>

					<div class="form-container">
						<div id="create-incident-message" class="message"></div>

						<form id="create-incident-form">
							<div class="form-group">
								<label for="incident-article">Artículo</label>
								<select id="incident-article" required>
									<option value="">Selecciona un artículo</option>
									<!-- Las opciones se llenarán dinámicamente -->
								</select>
							</div>

							<div class="form-group">
								<label for="incident-description">Descripción</label>
								<textarea id="incident-description" placeholder="Describe la incidencia..." required></textarea>
							</div>

							<div class="form-group">
								<label for="incident-priority">Prioridad</label>
								<select id="incident-priority" required>
									<option value="">Selecciona una prioridad</option>
									<option value="Alta">Alta</option>
									<option value="Media">Media</option>
									<option value="Baja">Baja</option>
								</select>
							</div>

							<div class="form-buttons">
								<button type="button" class="btn-cancel" id="btn-cancel-incident">
									Cancelar
								</button>
								<button type="submit" class="btn-submit">Crear Incidencia</button>
							</div>
						</form>
					</div>
				</section>

				<!-- SECCIÓN: LISTADO DE INCIDENCIAS -->
				<section class="content-section incidents-section active" id="incidents">
					<h2>Listado de Incidencias</h2>

					<div class="table-wrapper">
						<table id="incidents-table">
							<thead>
								<tr>
									<th>Código</th>
									<th>Artículo</th>
									<th>Prioridad</th>
									<th>Estado</th>
									<th>Acción</th>
								</tr>
							</thead>
							<tbody id="incidents-table-body">
								<!-- Las incidencias se llenarán dinámicamente -->
							</tbody>
						</table>
					</div>
				</section>
			</div>
		</div>
	</div>

	<script src="./municipal-incidencias.js"></script>
</body>

</html>
