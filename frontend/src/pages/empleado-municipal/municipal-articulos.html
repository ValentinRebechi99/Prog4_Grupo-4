<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Empleado Municipal - Artículos</title>
	<link rel="stylesheet" href="../css/style.css">
</head>

<body>
	<div class="employee-container">
		<!-- HEADER -->
		<header class="employee-header">
			<div class="header-left">
				<h1 class="header-title">Empleado Municipal</h1>
				<a href="../../../index.html" class="logout-btn">Salir</a>
			</div>
			<div class="header-right">
				<img src="../../imagenes/logo.jpg" alt="Logo Municipal">
			</div>
		</header>

		<!-- CONTENIDO PRINCIPAL -->
		<div class="main-content">
			<!-- MENÚ LATERAL -->
			<aside class="sidebar-menu">
				<a href="municipal-articulos.html" class="menu-item active">Listar artículos</a>
				<a href="municipal-incidencias.html#create-incident" class="menu-item">Crear una Incidencia</a>
				<a href="municipal-incidencias.html" class="menu-item">Listado de incidencias</a>
			</aside>

			<!-- ÁREA DE CONTENIDO -->
			<div class="content-area">
				<!-- SECCIÓN: LISTAR ARTÍCULOS -->
				<section class="content-section articles-section active" id="articles">
					<div class="section-header">
						<h2>Artículos Disponibles</h2>
					</div>

					<div class="table-wrapper">
						<table id="articles-table">
							<thead>
								<tr>
									<th>Código</th>
									<th>Categoría</th>
									<th>Descripción</th>
									<th>Área</th>
								</tr>
							</thead>
							<tbody id="articles-table-body">
								<!-- Las filas se insertarán dinámicamente -->
							</tbody>
						</table>
					</div>
				</section>
			</div>
		</div>
	</div>

	<script src="./municipal-articulos.js"></script>
</body>

</html>
