<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Panel Director - Incidencias</title>
	<link rel="stylesheet" href="../css/style.css">
	<script src="../../utils/auth.js" data-roles="1"></script>
</head>

<body>
	<div class="employee-container">
		<!-- HEADER -->
		<header class="employee-header">
			<div class="header-left">
				<h1 class="header-title">Director Área Sistemas</h1>
				<a href="../../../index.html" class="logout-btn">Salir</a>
			</div>
			<div class="header-right">
				<img src="../../imagenes/logo.jpg" alt="Logo" />
			</div>
		</header>

		<!-- CONTENIDO PRINCIPAL CON MENÚ -->
		<div class="main-content">
			<!-- MENÚ LATERAL -->
			<aside class="sidebar-menu">
				<a href="director-dashboard.html" class="menu-item">Inicio</a>
				<a href="director-incidencias.html" class="menu-item active">Incidencias</a>
				<a href="director-reportes.html" class="menu-item">Reportes</a>
			</aside>

			<!-- ÁREA DE CONTENIDO -->
			<main class="content-area">
				<!-- SECCIÓN: INCIDENCIAS -->
				<section id="incidencias" class="content-section active">
					<h2>Gestión de Incidencias Pendientes</h2>
					<div class="table-wrapper">
						<table id="incidencias-table">
							<thead>
								<tr>
									<th>Código</th>
									<th>Artículo</th>
									<th>Prioridad</th>
									<th>Estado</th>
									<th>Empleado Asignado</th>
									<th>Acciones</th>
								</tr>
							</thead>
							<tbody>
								<!-- Los datos se cargarán aquí dinámicamente -->
							</tbody>
						</table>
					</div>
				</section>
			</main>
		</div>
	</div>

	<!-- MODAL PARA ASIGNAR INCIDENCIA -->
	<div id="modal-asignar" class="modal">
		<div class="modal-content">
			<div class="modal-header">
				<h3>Asignar Incidencia</h3>
				<span class="close-modal" id="btn-cerrar-modal">&times;</span>
			</div>
			<div class="modal-body" style="margin-top: 1rem;">
				<div class="form-group">
					<label for="empleado-select">Seleccionar Empleado:</label>
					<select id="empleado-select">
						<option value="">Seleccione un empleado...</option>
						<option value="1">Empleado Sistemas 1</option>
						<option value="2">Empleado Sistemas 2</option>
						<option value="3">Soporte Técnico Municipal</option>
					</select>
				</div>
			</div>
			<div class="form-buttons" style="margin-top: 1.5rem;">
				<button class="btn-submit" id="btn-confirmar-asignacion">Asignar</button>
				<button class="btn-cancel" id="btn-cancelar-asignacion">Cancelar</button>
			</div>
		</div>
	</div>

	<script src="../../utils/ui.js"></script>
	<script src="./director-incidencias.js"></script>
</body>

</html>
