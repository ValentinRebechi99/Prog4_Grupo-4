<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Panel Director - Dashboard</title>
	<link rel="stylesheet" href="../css/style.css">
	<script src="../../utils/auth.js" data-roles="1"></script>
</head>

<body>
	<div class="employee-container">
		<!-- HEADER -->
		<header class="employee-header">
			<div class="header-left">
				<h1 class="header-title">Director Área Sistemas</h1>
				<a href="../../../index.html" class="logout-btn">Salir</a>
			</div>
			<div class="header-right">
				<img src="../../imagenes/logo.jpg" alt="Logo" />
			</div>
		</header>

		<!-- CONTENIDO PRINCIPAL CON MENÚ -->
		<div class="main-content">
			<!-- MENÚ LATERAL -->
			<aside class="sidebar-menu">
				<a href="director-dashboard.html" class="menu-item active">Inicio</a>
				<a href="director-incidencias.html" class="menu-item">Incidencias</a>
				<a href="director-reportes.html" class="menu-item">Reportes</a>
			</aside>

			<!-- ÁREA DE CONTENIDO -->
			<main class="content-area">
				<!-- SECCIÓN: INICIO (DASHBOARD) -->
				<section id="inicio" class="content-section active">
					<h2>Dashboard</h2>
					<div class="dashboard-grid">
						<!-- Tarjeta 1: Totales por Estados -->
						<div class="dashboard-card">
							<div class="card-header">
								<h3>Incidencias por Estado</h3>
							</div>
							<div class="card-body">
								<div class="stat-item">
									<span class="stat-label">Pendientes:</span>
									<span class="stat-value" id="stat-pendientes">0</span>
								</div>
								<div class="stat-item">
									<span class="stat-label">En Proceso:</span>
									<span class="stat-value" id="stat-proceso">0</span>
								</div>
								<div class="stat-item">
									<span class="stat-label">Resueltas:</span>
									<span class="stat-value" id="stat-resueltas">0</span>
								</div>
								<div class="stat-item">
									<span class="stat-label">Canceladas:</span>
									<span class="stat-value" id="stat-canceladas">0</span>
								</div>
							</div>
						</div>

						<!-- Tarjeta 2: Totales por Fecha -->
						<div class="dashboard-card">
							<div class="card-header">
								<h3>Incidencias por Fecha</h3>
							</div>
							<div class="card-body">
								<div class="stat-item">
									<span class="stat-label">Hoy:</span>
									<span class="stat-value" id="stat-hoy">0</span>
								</div>
								<div class="stat-item">
									<span class="stat-label">Esta Semana:</span>
									<span class="stat-value" id="stat-semana">0</span>
								</div>
								<div class="stat-item">
									<span class="stat-label">Este Mes:</span>
									<span class="stat-value" id="stat-mes">0</span>
								</div>
								<div class="stat-item">
									<span class="stat-label">Total General:</span>
									<span class="stat-value" id="stat-total">0</span>
								</div>
							</div>
						</div>

						<!-- Tarjeta 3: Incidencias Prioritarias -->
						<div class="dashboard-card">
							<div class="card-header">
								<h3>Incidencias Prioritarias</h3>
							</div>
							<div class="card-body">
								<div class="stat-item">
									<span class="stat-label">Críticas:</span>
									<span class="stat-value stat-critical" id="stat-criticas">0</span>
								</div>
								<div class="stat-item">
									<span class="stat-label">Altas:</span>
									<span class="stat-value stat-high" id="stat-altas">0</span>
								</div>
								<div class="stat-item">
									<span class="stat-label">Medias:</span>
									<span class="stat-value stat-medium" id="stat-medias">0</span>
								</div>
								<div class="stat-item">
									<span class="stat-label">Bajas:</span>
									<span class="stat-value stat-low" id="stat-bajas">0</span>
								</div>
							</div>
						</div>
					</div>
				</section>
			</main>
		</div>
	</div>

	<script src="./director-dashboard.js"></script>
</body>

</html>
