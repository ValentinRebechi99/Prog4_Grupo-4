<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#102a43">
	<meta name="description" content="Portal de incidencias informáticas - Iniciar sesión">
	<title>Portal Municipal - Iniciar sesión</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="/css/index.css">
</head>
<body>
	<main class="login-shell">
		<section class="welcome-panel" aria-label="Información del portal">
			<p class="eyebrow">Portal de incidencias informaticas</p>
			<p class="imagen"><img src="/imagenes/logo.jpg" alt="Logo"></p>
			<div class="status-line"><span class="status-dot"></span> Grupo 4 Programación IV</div>
			<div class="panel-decoration" aria-hidden="true"><span></span><span></span><span></span></div>
		</section>

		<section class="form-panel" aria-labelledby="login-title">
			<div class="form-content">
				<div class="mobile-brand"><img src="/imagenes/logo.jpg" alt="Logo"></div>
				<p class="eyebrow">Bienvenido de nuevo</p>
				<h2 id="login-title">Iniciar sesión</h2>
				<p class="form-intro">Ingresá tus datos para continuar al portal.</p>

				<form id="login-form" novalidate>
					<div class="field-group">
						<label for="email">Usuario o correo electrónico</label>
						<div class="input-wrap">
							<span class="input-icon" aria-hidden="true">@</span>
							<input id="email" name="email" type="text" autocomplete="username" placeholder="nombre@empresa.com" required>
						</div>
					</div>

					<div class="field-group">
						<div class="label-row">
							<label for="password">Contraseña</label>
							<a href="#" id="forgot-link">¿La olvidaste?</a>
						</div>
						<div class="input-wrap">
							<span class="input-icon lock-icon" aria-hidden="true">•</span>
							<input id="password" name="password" type="password" autocomplete="current-password" placeholder="Ingresá tu contraseña" required>
							<button class="password-toggle" id="password-toggle" type="button" aria-label="Mostrar contraseña">Mostrar</button>
						</div>
					</div>

					<label class="remember-option"><input type="checkbox" name="remember"><span class="checkmark" aria-hidden="true"></span>Recordarme en este dispositivo</label>
					<p class="form-message" id="form-message" role="alert" aria-live="polite"></p>
					<button class="submit-button" type="submit">Ingresar <span aria-hidden="true">→</span></button>
				</form>

				<p class="help-text">¿Tenés problemas para ingresar? <a href="mailto:soporte@portal-integrador.com">Contactá a soporte</a></p>
			</div>
			<footer>© Grupo 4 Programación IV <span>•</span> Acceso protegido</footer>
		</section>
	</main>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	<script src="./js/login.js"></script>
</body>
</html>
